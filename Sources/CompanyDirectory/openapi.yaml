openapi: 3.1.1
info:
  title: Company Directory API
  version: 0.1.0
  description: API for managing company employees and departments
  contact:
    email: glenn@sequeiralabs.com
servers:
  - url: /api
tags:
  - name: departments
    description: Department management endpoints
  - name: employees
    description: Employee management endpoints
paths:
  /departments:
    get:
      summary: List departments
      description: Retrieves a list of all departments.
      operationId: listDepartments
      tags:
        - departments
      responses:
        "200":
          description: The list of departments was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentList"
    post:
      summary: Create a department
      description: Creates a new department with the given name.
      operationId: createDepartment
      tags:
        - departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: The department was created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "409":
          description: A department with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
  /departments/{departmentId}:
    parameters:
      - $ref: "#/components/parameters/path.departmentId"
    get:
      summary: Retrieve a department
      description: Retrieves the details of a single department by ID.
      operationId: getDepartmentDetail
      tags:
        - departments
      responses:
        "200":
          description: The department was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: No department exists with the specified ID.
    patch:
      summary: Update a department
      description: Updates the name of an existing department.
      operationId: updateDepartment
      tags:
        - departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"
      responses:
        "200":
          description: The department was updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: No department exists with the specified ID.
        "409":
          description: A department with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
    delete:
      summary: Delete a department
      description: Permanently deletes an existing department.
      operationId: deleteDepartment
      tags:
        - departments
      responses:
        "204":
          description: The department was deleted successfully.
        "404":
          description: No department exists with the specified ID.
        "409":
          description: The department still has employees assigned to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
  /departments/{departmentId}/transfer:
    parameters:
      - $ref: "#/components/parameters/path.departmentId"
    post:
      summary: Transfer all employees to another department
      description: Moves every employee out of this department into another, and optionally
        deletes this one once it is empty. Both writes share a transaction.
      operationId: transferEmployees
      tags:
        - departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferEmployeesRequest"
      responses:
        "200":
          description: The transfer completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        "404":
          description: No department exists with the specified ID.
        "409":
          description: The source department could not be deleted, because an employee was
            assigned to it while the transfer was running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "422":
          description: The target department does not exist, or is the source department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceError"
  /employees:
    get:
      summary: List employees
      description: Retrieves a list of all employees.
      operationId: listEmployees
      tags:
        - employees
      responses:
        "200":
          description: The list of employees was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeList"
    post:
      summary: Create an employee
      description: Creates a new employee with a given first name and last name.
      operationId: createEmployee
      tags:
        - employees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: The employee was created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "409":
          description: An employee with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "422":
          description: The specified departmentId does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceError"
  /employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/path.employeeId"
    get:
      summary: Retrieve an employee
      description: Retrieves the details of a single employee by ID.
      operationId: getEmployeeDetail
      tags:
        - employees
      responses:
        "200":
          description: The employee was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: No employee exists with the specified ID.
    patch:
      summary: Update an employee
      description: Updates the first name, the last name, or both. Omitted fields are left unchanged.
      operationId: updateEmployee
      tags:
        - employees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: The employee was updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: No employee exists with the specified ID.
        "409":
          description: An employee with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "422":
          description: The specified departmentId does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceError"
    delete:
      summary: Delete an employee
      description: Permanently deletes an existing employee.
      operationId: deleteEmployee
      tags:
        - employees
      responses:
        "204":
          description: The employee was deleted successfully.
        "404":
          description: No employee exists with the specified ID.
components:
  parameters:
    path.departmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    path.employeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  schemas:
    Department:
      description: Represents a department within the organization.
      properties:
        id:
          type: integer
          description: The primary key of the department.
        name:
          type: string
          description: The name of the department.
          example: Customer Support
      required:
        - id
        - name
    DepartmentList:
      description: A collection of departments.
      properties:
        departments:
          type: array
          items:
            $ref: "#/components/schemas/Department"
      required:
        - departments
    CreateDepartmentRequest:
      description: The payload required to create a new department.
      properties:
        name:
          description: The name of the department.
          type: string
      required:
        - name
    UpdateDepartmentRequest:
      description: The payload required to update an existing department.
      properties:
        name:
          description: The updated name for the department.
          type: string
    TransferEmployeesRequest:
      description: The payload required to transfer every employee out of a department.
      properties:
        targetDepartmentId:
          description: The department to move every employee into. Must already exist, and must
            not be the source department.
          type: integer
          format: int32
          example: 2
        deleteSourceAfterTransfer:
          description: Whether to delete the source department once it is empty. The delete shares
            a transaction with the move, so both land or neither does. Defaults to false.
          type: boolean
          example: true
      required:
        - targetDepartmentId
    TransferResult:
      description: What a transfer actually did. This is an operation rather than a resource, so
        the response summarizes the work instead of returning a department.
      properties:
        transferred:
          description: How many employees moved. Zero is a success, not an error, and means the
            source department was already empty.
          type: integer
          example: 12
        sourceDeleted:
          description: Whether the source department was deleted. False when
            deleteSourceAfterTransfer was absent or false.
          type: boolean
          example: true
      required:
        - transferred
        - sourceDeleted
    Employee:
      description: Represents an employee within the organization.
      properties:
        id:
          type: integer
          description: The primary key of the employee.
        departmentId:
          type: integer
          format: int32
          description: The department this employee belongs to.
          example: 1
        firstName:
          type: string
          description: The first name of the employee.
          example: Jane
        lastName:
          type: string
          description: The last name of the employee.
          example: Doe
      required:
        - id
        - departmentId
        - firstName
        - lastName
    EmployeeList:
      description: A collection of employees.
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
      required:
        - employees
    CreateEmployeeRequest:
      description: The payload required to create a new employee.
      properties:
        departmentId:
          description: The department to place this employee in. Must already exist.
          type: integer
          format: int32
          example: 1
        firstName:
          description: The first name of the employee.
          type: string
        lastName:
          description: The last name of the employee.
          type: string
      required:
        - departmentId
        - firstName
        - lastName
    UpdateEmployeeRequest:
      description: The fields to update. Omitted fields are left unchanged.
      properties:
        departmentId:
          description: The department to move this employee to. Must already exist.
          type: integer
          format: int32
          example: 2
        firstName:
          description: The updated first name for the employee.
          type: string
        lastName:
          description: The updated last name for the employee.
          type: string
    ReferenceError:
      description: >-
        Returned when a request is well-formed and addresses an existing resource, but names
        another resource in its payload that does not exist — currently only an unknown
        departmentId on an employee.
      properties:
        error:
          type: boolean
          example: true
        reason:
          type: string
          example: No department exists with id 42
      required:
        - error
        - reason
    ConflictError:
      description: Standard error response returned when a request conflicts with
        existing data.
      properties:
        error:
          type: boolean
          example: true
        reason:
          type: string
          example: A resource with this name already exists
      required:
        - error
        - reason
