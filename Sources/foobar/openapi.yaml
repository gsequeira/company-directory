---
openapi: 3.1.1
info:
  title: foobar
  version: 0.1.0
servers:
  - url: /api
paths:
  /departments:
    get:
      summary: Fetch a list of departments
      operationId: listDepartments
      tags:
        - Departments
      responses:
        "200":
          description: Returns the list of departments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfDepartments"
    post:
      summary: Create a new department
      operationId: createDepartment
      tags:
        - Departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: The department was created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "401":
          description: Unauthorized
        "409":
          description: Conflict - A department with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
  /departments/{departmentId}:
    parameters:
      - $ref: "#/components/parameters/path.departmentId"
    get:
      summary: Fetch the details of a department
      operationId: getDepartmentDetail
      tags:
        - Departments
      responses:
        "200":
          description: A successfull response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: A department with this id was not found
    patch:
      summary: Update any exisitng department
      operationId: updateDepartment
      tags:
        - Departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"
      responses:
        "200":
          description: The department was updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: A department with this id was not found
        "409":
          description: Conflict - a department with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
    delete:
      summary: Delete an existing department
      operationId: deleteDepartment
      tags:
        - Department
      responses:
        "204":
          description: The department was deleted successfully
        "404":
          description: A department with this id was not found
components:
  parameters:
    path.departmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: integer
        format: int
  schemas:
    Department:
      description: A department
      properties:
        id:
          type: integer
          description: The primary key of the department
        name:
          type: string
          description: The name of the department
          example: "Customer Support"
      required:
        - id
        - name
    PageOfDepartments:
      description: A single page of departments
      properties:
        departments:
          type: array
          items:
            $ref: "#/components/schemas/Department"
      required:
        - departments
    CreateDepartmentRequest:
      description: The request data required to create a department
      properties:
        name:
          description: The name of the department
          type: string
      required:
        - name
    ConflictError:
      description: Error response for conflicts
      properties:
        error:
          type: boolean
          example: true
        reason:
          type: string
          example: "A department with the name 'Customer Support' already exists"
      required:
        - error
        - reason
    UpdateDepartmentRequest:
      description: The request data required for updating a department
      properties:
        name:
          description: The updated name for the department
          type: string
      required:
        - name
